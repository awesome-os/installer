name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stage _site for GitHub Pages
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r web/. _site/
          if [ ! -f _site/index.html ] && [ -f _site/opfs-installer.html ]; then
            cp _site/opfs-installer.html _site/index.html
          fi
          (cd _site && sha512sum install.ps1 install.sh > SHA512SUMS.txt)
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
