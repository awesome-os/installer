name: Clean-Box Stranger E2E

on:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  clean-box-stranger-e2e:
    name: Clean-Box Stranger (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Setup Node 24 (zero repo checkout)
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify live endpoints, Ed25519 + SHA-512 v11 bundle, and v1.0.0 signed assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat <<'EOF' > clean-box-verify.mjs
          import assert from 'node:assert/strict';
          import { createHash, createPublicKey, verify } from 'node:crypto';

          // 1. Live HTTP 200 checks across awesome-os.github.io
          const liveUrls = [
            'https://awesome-os.github.io/installer/',
            'https://awesome-os.github.io/installer/v11-bundle.json',
            'https://awesome-os.github.io/holo-v11/gravity-telemetry.json',
            'https://awesome-os.github.io/holo-v11/oversight.html',
            'https://awesome-os.github.io/agent-platform/',
          ];

          for (const url of liveUrls) {
            const res = await fetch(url, { cache: 'no-store' });
            assert.equal(res.status, 200, `Expected HTTP 200 for ${url}, got ${res.status}`);
            const body = await res.arrayBuffer();
            assert.ok(body.byteLength > 0, `Empty response body for ${url}`);
            console.log(`[HTTP 200] ${url} (${body.byteLength} B)`);
          }

          // 2. Canonicalize v11-bundle.json, verify Ed25519 signature + payloadSha512, and verify every artifact SHA-512
          const bundleUrl = 'https://awesome-os.github.io/installer/v11-bundle.json';
          const bundleRes = await fetch(bundleUrl, { cache: 'no-store' });
          assert.equal(bundleRes.status, 200, `Expected HTTP 200 for ${bundleUrl}`);
          const bundle = await bundleRes.json();

          assert.equal(bundle.schema, 'awesome-os.web-v11-bundle.v1');
          assert.equal(bundle.signature?.scheme, 'ed25519-sha512-v1');
          assert.match(bundle.signature.publicKeyHex, /^[0-9a-f]{64}$/i);
          assert.match(bundle.signature.payloadSha512, /^[0-9a-f]{128}$/i);
          assert.match(bundle.signature.signatureHex, /^[0-9a-f]{128}$/i);

          function canonicalizeJson(value) {
            if (value === null || typeof value !== 'object') {
              return JSON.stringify(value);
            }
            if (Array.isArray(value)) {
              return '[' + value.map((v) => canonicalizeJson(v)).join(',') + ']';
            }
            const keys = Object.keys(value)
              .filter((k) => k !== 'signature' && value[k] !== undefined)
              .sort();
            return '{' + keys.map((k) => JSON.stringify(k) + ':' + canonicalizeJson(value[k])).join(',') + '}';
          }

          const canonicalPayload = canonicalizeJson(bundle);
          const computedPayloadSha512 = createHash('sha512').update(canonicalPayload, 'utf8').digest('hex');
          assert.equal(
            computedPayloadSha512,
            bundle.signature.payloadSha512,
            'Canonical payload SHA-512 mismatch',
          );

          const ED25519_SPKI_PREFIX = Buffer.from('302a300506032b6570032100', 'hex');
          const spki = Buffer.concat([
            ED25519_SPKI_PREFIX,
            Buffer.from(bundle.signature.publicKeyHex, 'hex'),
          ]);
          const publicKey = createPublicKey({ key: spki, format: 'der', type: 'spki' });
          const sigOk = verify(
            null,
            Buffer.from(canonicalPayload, 'utf8'),
            publicKey,
            Buffer.from(bundle.signature.signatureHex, 'hex'),
          );
          assert.equal(sigOk, true, 'Ed25519 cryptographic signature verification failed');
          console.log(
            `[ED25519 OK] keyId=${bundle.signature.keyId} payloadSha512=${computedPayloadSha512.slice(0, 16)}...`,
          );

          assert.ok(Array.isArray(bundle.artifacts) && bundle.artifacts.length > 0, 'Bundle has no artifacts');
          for (const artifact of bundle.artifacts) {
            const artifactUrl = new URL(artifact.url, bundleUrl).href;
            const artRes = await fetch(artifactUrl, { cache: 'no-store' });
            assert.equal(artRes.status, 200, `Expected HTTP 200 for artifact ${artifactUrl}`);
            const buf = Buffer.from(await artRes.arrayBuffer());
            if (typeof artifact.bytes === 'number') {
              assert.equal(buf.byteLength, artifact.bytes, `Byte length mismatch for ${artifact.id}`);
            }
            const actualSha512 = createHash('sha512').update(buf).digest('hex');
            assert.equal(actualSha512, artifact.sha512, `SHA-512 mismatch for ${artifact.id}`);
            console.log(
              `[SHA-512 OK] ${artifact.id} (${buf.byteLength} B) -> ${actualSha512.slice(0, 16)}...`,
            );
          }

          // 3. Verify GitHub release awesome-os/awesome-os v1.0.0 has signed assets > 0
          const releaseUrl = 'https://api.github.com/repos/awesome-os/awesome-os/releases/tags/v1.0.0';
          const baseHeaders = {
            'User-Agent': 'awesome-os-clean-box-stranger-e2e',
            Accept: 'application/vnd.github+json',
          };
          let relRes = await fetch(releaseUrl, {
            headers: process.env.GH_TOKEN
              ? { ...baseHeaders, Authorization: `Bearer ${process.env.GH_TOKEN}` }
              : baseHeaders,
          });
          if ((relRes.status === 401 || relRes.status === 403) && process.env.GH_TOKEN) {
            relRes = await fetch(releaseUrl, { headers: baseHeaders });
          }
          assert.equal(relRes.status, 200, `Expected HTTP 200 for ${releaseUrl}, got ${relRes.status}`);
          const release = await relRes.json();
          assert.ok(Array.isArray(release.assets) && release.assets.length > 0, 'v1.0.0 release has no assets');

          const signedAssets = release.assets.filter(
            (a) =>
              a.size > 0 &&
              /^(SHA(256|512)SUMS\.txt|omaha-stable-channel\.json|cas-v11-release-manifest\.json)$|\.(sig|asc|minisig)$/i.test(
                a.name,
              ),
          );
          assert.ok(signedAssets.length > 0, 'v1.0.0 release has 0 signed/checksum manifest assets');

          const sumsAsset = release.assets.find((a) => a.name === 'SHA512SUMS.txt');
          assert.ok(sumsAsset, 'v1.0.0 release missing SHA512SUMS.txt');
          const sumsRes = await fetch(sumsAsset.browser_download_url, { cache: 'no-store' });
          assert.equal(sumsRes.status, 200, `Failed to download SHA512SUMS.txt: HTTP ${sumsRes.status}`);
          const sumsLines = (await sumsRes.text()).trim().split(/\r?\n/).filter(Boolean);
          assert.ok(sumsLines.length > 0, 'SHA512SUMS.txt is empty');
          console.log(
            `[RELEASE OK] v1.0.0 totalAssets=${release.assets.length} signedAssets=${signedAssets.length} sha512SumsLines=${sumsLines.length}`,
          );
          EOF
          node clean-box-verify.mjs
          rm -f clean-box-verify.mjs

      - name: Live Compiled Binary Stranger Execution (ubuntu-latest)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          WORK_DIR="/tmp/holo-stranger-work"
          EXTRACT_DIR="/tmp/holo-stranger-test"
          rm -rf "${WORK_DIR}" "${EXTRACT_DIR}"
          mkdir -p "${WORK_DIR}" "${EXTRACT_DIR}"

          BASE_URL="https://github.com/awesome-os/devtools/releases/download/v11-devtools-launchers-latest"
          TAR_NAME="devtools-launchers-linux-x86_64-holo-v11.tar.gz"

          curl -fsSL -o "${WORK_DIR}/SHA512SUMS.txt" "${BASE_URL}/SHA512SUMS.txt"
          curl -fsSL -o "${WORK_DIR}/${TAR_NAME}" "${BASE_URL}/${TAR_NAME}"

          (
            cd "${WORK_DIR}"
            awk -v f="${TAR_NAME}" '($2 == f || $2 == "*" f) && $1 ~ /^[0-9a-fA-F]{128}$/ { print; found=1 } END { exit !found }' SHA512SUMS.txt | sha512sum -c -
          )

          echo "[TAR LIST] ${TAR_NAME}"
          TAR_LIST="$(tar -tzf "${WORK_DIR}/${TAR_NAME}")"
          printf '%s\n' "${TAR_LIST}"
          grep -qxE '(\./)?holo-devtools-launcher' <<< "${TAR_LIST}"
          grep -qxE '(\./)?libsample_engine_plugin\.so' <<< "${TAR_LIST}"

          tar -xzf "${WORK_DIR}/${TAR_NAME}" -C "${EXTRACT_DIR}"
          chmod +x "${EXTRACT_DIR}/holo-devtools-launcher" "${EXTRACT_DIR}/libsample_engine_plugin.so"

          shopt -s nullglob
          bmp_files=("${EXTRACT_DIR}"/*.bmp)
          if [ "${#bmp_files[@]}" -eq 0 ]; then
            echo "ERROR: No extracted .bmp splash files found in ${EXTRACT_DIR}" >&2
            exit 1
          fi
          echo "[SPLASHES OK] count=${#bmp_files[@]} files=${bmp_files[*]}"

          LAUNCHER_OUT="$(LD_LIBRARY_PATH="${EXTRACT_DIR}" "${EXTRACT_DIR}/holo-devtools-launcher" "${EXTRACT_DIR}/libsample_engine_plugin.so")"
          echo "[LAUNCHER STDOUT] ${LAUNCHER_OUT}"

          if ! printf '%s\n' "${LAUNCHER_OUT}" | grep -qF '0x33564742'; then
            echo "ERROR: Expected stdout to contain 0x33564742 (B8G_ABI_MAGIC_V3)" >&2
            exit 1
          fi
          if ! printf '%s\n' "${LAUNCHER_OUT}" | grep -qF 'loaded=1'; then
            echo "ERROR: Expected stdout to contain loaded=1" >&2
            exit 1
          fi

          rm -rf "${WORK_DIR}" "${EXTRACT_DIR}"
